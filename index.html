<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ hi ek hello guyz ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #141b2b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            padding: 1.5rem;
        }

        /* main card – glassmorphism + float */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 4rem 2rem 4rem 2rem;
            padding: 3rem 4.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            text-align: center;
            max-width: 1000px;
            width: fit-content;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
            animation: float 5s ease-in-out infinite;
        }

        .card:hover {
            transform: scale(1.02) rotate(0.5deg);
            box-shadow: 0 45px 70px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 215, 0, 0.2);
        }

        /* main headline – each word pops */
        .glow-headline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.25rem 0.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .word {
            display: inline-block;
            font-size: clamp(3.2rem, 14vw, 6.8rem);
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255, 200, 100, 0.3);
            transition: all 0.2s ease;
            animation: wordPop 1.2s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
            animation-delay: calc(0.1s * var(--i, 0));
        }

        .word:hover {
            transform: translateY(-8px) scale(1.04);
            filter: drop-shadow(0 0 20px gold);
        }

        /* each word gets its own gradient + sparkle */
       
        .word-3 {
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            --i: 2;
        }
        .word-4 {
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            --i: 3;
        }
        .word-5 {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            --i: 4;
        }

        /* extra sparkle under the words */
        .sub-glow {
            margin-top: 0.5rem;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            display: inline-block;
            animation: shimmer 4s infinite linear;
        }

        /* decorative floating particles (purely css) */
        .particle-field {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 215, 0, 0.25);
            border-radius: 50%;
            box-shadow: 0 0 20px 4px rgba(255, 200, 50, 0.2);
            animation: floatParticle 18s infinite alternate ease-in-out;
        }

        .particle:nth-child(1) {
            left: 10%;
            top: 20%;
            width: 12px;
            height: 12px;
            background: #ffb347;
            animation-duration: 22s;
            animation-delay: -2s;
        }
        .particle:nth-child(2) {
            left: 80%;
            top: 70%;
            width: 20px;
            height: 20px;
            background: #f093fb;
            animation-duration: 26s;
            animation-delay: -5s;
            opacity: 0.5;
        }
        .particle:nth-child(3) {
            left: 30%;
            top: 85%;
            width: 8px;
            height: 8px;
            background: #a1c4fd;
            animation-duration: 20s;
            animation-delay: -8s;
        }
        .particle:nth-child(4) {
            left: 70%;
            top: 15%;
            width: 18px;
            height: 18px;
            background: #f6d365;
            animation-duration: 24s;
            animation-delay: -3s;
            opacity: 0.4;
        }
        .particle:nth-child(5) {
            left: 50%;
            top: 50%;
            width: 28px;
            height: 28px;
            background: #ff9a9e;
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.15;
            filter: blur(4px);
        }
        .particle:nth-child(6) {
            left: 5%;
            top: 60%;
            width: 14px;
            height: 14px;
            background: #ffe99c;
            animation-duration: 19s;
            animation-delay: -1s;
        }
        .particle:nth-child(7) {
            left: 92%;
            top: 30%;
            width: 10px;
            height: 10px;
            background: #c2e9fb;
            animation-duration: 27s;
            animation-delay: -7s;
        }

        /* KEYFRAMES */
        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-18px) rotate(0.6deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        @keyframes wordPop {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-10deg) translateY(40px);
                filter: blur(6px);
            }
            60% {
                opacity: 1;
                transform: scale(1.1) rotate(1deg) translateY(-4px);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes shimmer {
            0% {
                opacity: 0.2;
                letter-spacing: 0.4em;
                color: rgba(255, 255, 255, 0.1);
            }
            50% {
                opacity: 0.9;
                letter-spacing: 0.7em;
                color: rgba(255, 215, 0, 0.5);
            }
            100% {
                opacity: 0.2;
                letter-spacing: 0.4em;
                color: rgba(255, 255, 255, 0.1);
            }
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2;
            }
            33% {
                transform: translate(40px, -60px) scale(1.6);
                opacity: 0.6;
            }
            66% {
                transform: translate(-30px, 30px) scale(0.8);
                opacity: 0.3;
            }
            100% {
                transform: translate(20px, -20px) scale(1.2);
                opacity: 0.5;
            }
        }

        /* responsive touch */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.8rem;
                border-radius: 2.5rem 1.2rem 2.5rem 1.2rem;
            }
            .glow-headline {
                gap: 0.1rem 0.3rem;
            }
            .word {
                font-size: clamp(2.8rem, 13vw, 4.2rem);
            }
            .sub-glow {
                font-size: 0.75rem;
                letter-spacing: 0.2em;
            }
        }

        @media (max-width: 420px) {
            .card {
                padding: 1.5rem 0.8rem;
            }
            .word {
                font-size: clamp(2.2rem, 11vw, 3.2rem);
            }
        }
    </style>
</head>
<body>
    <!-- floating particles background -->
    <div class="particle-field">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- main card -->
    <div class="card">
        <div class="glow-headline">
            <span class="word word-3">hello</span>
            <span class="word word-4">guyz</span>
            <span class="word word-5">✨</span>
        </div>
        <div class="sub-glow">✨ welcome </div>
    </div>
</body>
</html>
